services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hms_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      - APP_NAME=HMS
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:${APP_PORT:-8080}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=hms
      - DB_USERNAME=hms_user
      - DB_PASSWORD=hms_secret
      - AUTO_MIGRATE=true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - hms_storage:/var/www/html/storage

  db:
    image: mariadb:10.11
    container_name: hms_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: hms
      MYSQL_USER: hms_user
      MYSQL_PASSWORD: hms_secret
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - hms_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: hms_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db

volumes:
  hms_storage:
  hms_db_data:
